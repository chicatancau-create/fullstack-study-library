name: p03
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: p03
      POSTGRES_PASSWORD: p03-local-pass
      POSTGRES_DB: study_lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p03 -d study_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"

  mq:
    image: rabbitmq:4-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5673:5672"
      - "15673:15672"

  app:
    build: .
    environment:
      PGHOST: db
      PGUSER: p03
      PGPASSWORD: p03-local-pass
      PGDATABASE: study_lab
      AMQP_URL: amqp://guest:guest@mq:5672
      P03_API_KEY: local-api-key
      P03_PROVIDER_SECRET: local-provider-secret
      HOST: 0.0.0.0
      PORT: "8796"
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    ports:
      - "8796:8796"

  web:
    build: ./web
    depends_on:
      - app
    ports:
      - "8081:80"
