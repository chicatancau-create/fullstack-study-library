openapi: 3.0.3
info:
  title: 项目 03 交易 Demo API
  version: 1.0.0
  description: 本地合成数据演示；不含真实支付网关。
servers:
  - url: http://127.0.0.1:8796
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
    UserId:
      type: apiKey
      in: header
      name: x-user-id
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: string }
        sku: { type: string }
        qty: { type: integer }
        unit_price: { type: integer, description: 分 }
        amount: { type: integer, description: 服务端计算 = unit_price * qty }
        status: { type: string, enum: [created, paid, cancelled] }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              title: { type: string }
              unit_price: { type: integer }
              qty: { type: integer }
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200': { description: ok }
  /orders:
    post:
      summary: 创建订单（幂等）
      security: [{ ApiKey: [], UserId: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 4, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, qty]
              properties:
                sku: { type: string }
                qty: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201': { description: 新建订单, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '200': { description: 相同幂等键与请求体，返回原订单（idempotent=true） }
        '400': { description: 参数或幂等键非法 }
        '401': { description: 鉴权失败 }
        '404': { description: SKU 不存在 }
        '409': { description: 库存不足或幂等键复用但请求体不同 }
  /orders/{id}:
    get:
      summary: 查询自己的订单（含快照）
      security: [{ ApiKey: [], UserId: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 订单, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { description: 不存在或不属于当前用户 }
  /orders/{id}/cancel:
    post:
      summary: 取消未支付订单并回补库存
      security: [{ ApiKey: [], UserId: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已取消；重复取消 idempotent=true }
        '404': { description: 不存在或不属于当前用户 }
        '409': { description: 已支付不可取消 }
  /payments/callback:
    post:
      summary: 支付服务回调（HMAC-SHA256 签名，event_id 去重）
      parameters:
        - in: header
          name: x-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, order_id, result]
              properties:
                event_id: { type: string }
                order_id: { type: integer }
                result: { type: string, enum: [success, failed] }
      responses:
        '200': { description: 已处理或重复事件 }
        '202': { description: 订单已取消，事件记录但不应用 }
        '400': { description: 事件字段非法 }
        '401': { description: 签名错误 }
        '404': { description: 订单不存在 }
