name: p04-saas

on:
  push:
    paths: ['07-项目实现/P04-综合SaaS/**']
  pull_request:
    paths: ['07-项目实现/P04-综合SaaS/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07-项目实现/P04-综合SaaS } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: p04, POSTGRES_PASSWORD: p04-ci-pass, POSTGRES_DB: study_lab }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p04 -d study_lab" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: p04
      PGPASSWORD: p04-ci-pass
      PGDATABASE: study_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07-项目实现/P04-综合SaaS/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07-项目实现/P04-综合SaaS } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: p04, POSTGRES_PASSWORD: p04-ci-pass, POSTGRES_DB: study_lab }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p04 -d study_lab" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: p04
      PGPASSWORD: p04-ci-pass
      PGDATABASE: study_lab
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
