groups:
  - name: p04-api
    rules:
      - alert: HighErrorRate
        expr: sum(rate(p04_http_requests_total{status=~"4..|5.."}[5m])) / sum(rate(p04_http_requests_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p04 HTTP 4xx/5xx 比例超过 20%"
      - alert: JobBacklog
        expr: p04_jobs_pending > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p04 后台任务积压超过 50"
