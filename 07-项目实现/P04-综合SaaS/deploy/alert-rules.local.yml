groups:
  - name: p04-local
    rules:
      - alert: HighErrorRate
        expr: sum(rate(p04_http_requests_total{status=~"4..|5.."}[1m])) / sum(rate(p04_http_requests_total[1m])) > 0.2
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "p04 4xx/5xx > 20% (local drill)"
      - alert: JobBacklog
        expr: p04_jobs_pending > 50
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "p04 pending jobs > 50 (local drill)"
