name: ms1-p04

on:
  push:
    paths:
      - '07-项目实现/P04-综合SaaS/**'
      - '.github/workflows/ms1-p04.yml'
  pull_request:
    paths:
      - '07-项目实现/P04-综合SaaS/**'
      - '.github/workflows/ms1-p04.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-项目实现/P04-综合SaaS
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: p04
          POSTGRES_PASSWORD: p04-ci-pass
          POSTGRES_DB: study_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p04 -d study_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: p04
      PGPASSWORD: p04-ci-pass
      PGDATABASE: study_lab
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run build
