name: experiments

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: secret scan
        run: |
          ! git grep -q -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}' -- . ':!05-外部资料库' ':!90-历史归档'
          ! git ls-files -- . ':!05-外部资料库' ':!90-历史归档' | grep -E '(^|/)(\.env|\.env\.(local|production|development|test)|id_rsa|id_ed25519|.*\.(pem|key|p12|pfx))$|(^|/)node_modules/|(^|/)target/'
      - run: python3 -X utf8 05-外部资料库/_采集暂存/catalog_tool.py validate --mode source-only
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E01-c-memory/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E02-node-async/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E04-http-network/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/G1-responsive-site/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E03-react-race/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E05-build-render/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E06-runtime-diag/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E07-pg-owner-race/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E08-pg-plan-migrate/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E09-redis-cache/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E11-authz-matrix/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E12-load-capacity/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E13-slo-fault/evidence/manifest.json
      - run: node 06-实验代码/_template/manifest.mjs verify 06-实验代码/E10-mq-outbox/evidence/manifest.json

  e01-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bash 06-实验代码/E01-c-memory/scripts/asan_linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e01-asan-evidence
          path: 06-实验代码/E01-c-memory/evidence/asan_linux.txt

  e02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bash 06-实验代码/E02-node-async/scripts/run_all.sh
